<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="simon.css">
</head>
<body>
    <h1>Simon Say's Game</h1>
    <h2>Click on Start button to start the game!</h2>
    <button id="stbtn">Start</button>
    <div class="box1">
        <div class="btn red" id="red" type="button"></div>
        <div class="btn blue" id="blue" type="button"></div>
    </div>
    <div class="box2">
        <div class="btn yellow" id="yellow" type="button"></div>
        <div class="btn orange" id="orange" type="button"></div>
    </div>
    
    <script src="simon.js"></script>
</body>
</html>
